[workspace]
resolver = "3"
members = ["crates/dpbst-core", "crates/dpbst-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/pomegranar/Anars-SAT-Solver"
authors = ["Anar N."]

[workspace.dependencies]
dpbst-core = { path = "crates/dpbst-core", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Solver code is full of deliberate index arithmetic and small numeric casts.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

# Benchmarks and differential tests need release speed with assertions on.
[profile.bench]
inherits = "release"
debug = 2

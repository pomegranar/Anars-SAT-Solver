name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Unit and integration tests
        run: cargo test --all-features

      # The differential suite compares against exhaustive truth tables and is far too slow
      # unoptimised, so it gets its own release-mode run.
      - name: Differential tests against brute force
        run: cargo test --release --test differential

      - name: Documentation builds without warnings
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  solve:
    name: solve real instances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Fetch a benchmark suite
        run: scripts/fetch_benchmarks.sh uf20-91 uuf50-218

      # Verdicts are known from the suite names: uf* is satisfiable, uuf* is not. Any
      # deviation is a hard failure, and every satisfiable answer is re-checked against the
      # input formula.
      - name: Check known verdicts
        run: scripts/check_verdicts.sh 200
